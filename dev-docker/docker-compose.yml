# Test stack for the netbox-ssh-keys plugin.
#
# Usage:
#   docker compose up -d --build
#
# NetBox will be available at http://localhost:8000
# Default credentials: admin / admin (API token in docker/env/netbox.env)

# Shared runtime config. Only the `netbox` service builds the image (see below);
# the worker/housekeeping services reuse the already-built `netbox-ssh-keys:dev`
# image. Defining `build` on more than one service that shares the same image tag
# makes Compose export the same tag in parallel, which fails with
# `image "...:dev": already exists` on the containerd image store / bake builder.
x-netbox-common: &netbox-common
  image: netbox-ssh-keys:dev
  env_file: env/netbox.env
  volumes:
    - ./plugins.py:/etc/netbox/config/plugins.py:ro
    - netbox-media-files:/opt/netbox/netbox/media
    - netbox-reports-files:/opt/netbox/netbox/reports
    - netbox-scripts-files:/opt/netbox/netbox/scripts
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    redis-cache:
      condition: service_healthy

services:
  netbox:
    <<: *netbox-common
    build:
      context: ..
      dockerfile: dev-docker/Dockerfile
    ports:
      - "8000:8080"
    healthcheck:
      test: curl -f http://localhost:8080/login/ || exit 1
      start_period: 90s
      timeout: 3s
      interval: 15s

  netbox-worker:
    <<: *netbox-common
    depends_on:
      netbox:
        condition: service_started
    command:
      - python
      - /opt/netbox/netbox/manage.py
      - rqworker
    healthcheck:
      test: ps -aux | grep -v grep | grep -q rqworker || exit 1
      start_period: 40s
      timeout: 3s
      interval: 15s

  netbox-housekeeping:
    <<: *netbox-common
    depends_on:
      netbox:
        condition: service_started
    command:
      - /opt/netbox/housekeeping.sh
    healthcheck:
      test: ps -aux | grep -v grep | grep -q housekeeping || exit 1
      start_period: 40s
      timeout: 3s
      interval: 15s

  postgres:
    image: postgres:16-alpine
    env_file: env/postgres.env
    volumes:
      - netbox-postgres-data:/var/lib/postgresql/data
      # Seed data is auto-loaded only when the data volume is empty
      # (i.e. on a fresh build / after `down -v`). See dev-docker/seed/.
      - ./seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command:
      - sh
      - -c
      - redis-server --appendonly yes $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}
    env_file: env/redis.env
    volumes:
      - netbox-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-cache:
    image: redis:7-alpine
    command:
      - sh
      - -c
      - redis-server $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}
    env_file: env/redis.env
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  netbox-media-files:
  netbox-postgres-data:
  netbox-redis-data:
  netbox-reports-files:
  netbox-scripts-files:
